name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
          # Maintenance DB only — workflow creates disposable cip_test below.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # ALLOW_TESTS_ON_DEV_DB intentionally unset — suite must use cip_test, not cip.
    env:
      DATABASE_URL: postgresql+asyncpg://cip:cip@localhost:5432/cip_test
      DATABASE_URL_SYNC: postgresql://cip:cip@localhost:5432/cip_test
      DATABASE_URL_SYNC_MIGRATE: postgresql://cip:cip@localhost:5432/cip_test
      # No Redis in CI — skip broker retry loops; use in-process thread fallback for import tasks.
      CIP_DEV_CELERY_DISPATCH: in_process_thread
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json packageManager (pnpm@9.15.9).
      # Do not also set `version:` here — pnpm/action-setup fails with
      # "Multiple versions of pnpm specified" (clash since PR #7).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Python dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create disposable CI databases
        run: |
          PGPASSWORD=cip psql -h localhost -U cip -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT current_database();" \
            -c "CREATE DATABASE cip_test;" \
            -c "CREATE DATABASE cip_bulk_smoke;" \
            -c "CREATE DATABASE cip_alembic_smoke;" \
            -c "CREATE DATABASE cip_e2e;"

      - name: Print resolved database URLs
        working-directory: apps/api
        run: |
          python - <<'PY'
          from app.core.config import get_settings
          s = get_settings()
          print("resolved DATABASE_URL=", s.database_url)
          print("resolved DATABASE_URL_SYNC=", s.database_url_sync)
          print("resolved DATABASE_URL_SYNC_MIGRATE=", s.database_url_sync_migrate)
          assert "cip_test" in s.database_url, s.database_url
          assert "cip_test" in s.database_url_sync, s.database_url_sync
          assert s.database_url_sync_migrate and "cip_test" in s.database_url_sync_migrate
          assert "ALLOW_TESTS_ON_DEV_DB" not in __import__("os").environ
          print("ALLOW_TESTS_ON_DEV_DB unset: OK")
          PY

      - name: Alembic migrate cip_test
        working-directory: apps/api
        run: |
          set -euo pipefail
          # Squashed baseline (20260801_0001): tip ORM create_all + view + system
          # reference rows. Post-squash 0002–0008 are idempotent when tip ORM
          # already created their objects. Full chain — no stamp head workaround.
          alembic upgrade head
          alembic current
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_settings
          from app.db.sync_url import sqlalchemy_sync_engine_url

          settings = get_settings()
          url = sqlalchemy_sync_engine_url(
              settings.database_url_sync_migrate or settings.database_url_sync
          )
          engine = create_engine(url)
          with engine.connect() as conn:
              db = conn.execute(text("SELECT current_database()")).scalar()
              tip = conn.execute(text("SELECT version_num FROM alembic_version")).scalar()
              print(f"current_database={db} alembic_version={tip}")
              assert db == "cip_test", db
              assert tip == "20260801_0008", tip
              assert conn.execute(
                  text(
                      "SELECT 1 FROM information_schema.tables "
                      "WHERE table_name = 'fact_demand_forecast'"
                  )
              ).scalar()
              assert conn.execute(
                  text(
                      "SELECT 1 FROM information_schema.columns "
                      "WHERE table_name = 'cpor_case' AND column_name = 'needs_reapproval'"
                  )
              ).scalar()
              assert conn.execute(
                  text(
                      "SELECT 1 FROM information_schema.tables "
                      "WHERE table_name = 'sql_viewer_audit'"
                  )
              ).scalar()
          PY

      - name: Alembic migrate disposable smoke DBs
        working-directory: apps/api
        run: |
          set -euo pipefail
          for dbname in cip_bulk_smoke cip_alembic_smoke cip_e2e; do
            echo "Migrating ${dbname} to tip..."
            DATABASE_URL="postgresql+asyncpg://cip:cip@localhost:5432/${dbname}" \
            DATABASE_URL_SYNC="postgresql://cip:cip@localhost:5432/${dbname}" \
            DATABASE_URL_SYNC_MIGRATE="postgresql://cip:cip@localhost:5432/${dbname}" \
              alembic upgrade head
            PGPASSWORD=cip psql -h localhost -U cip -d "${dbname}" -v ON_ERROR_STOP=1 \
              -c "SELECT current_database(), version_num FROM alembic_version;"
          done

      - name: API tests
        id: api_tests
        run: |
          set -o pipefail
          mkdir -p .tmp
          pnpm test:api 2>&1 | tee .tmp/ci-api-pytest.txt
          echo "API_TEST_EXIT=${PIPESTATUS[0]}" | tee -a .tmp/ci-api-pytest.txt

      - name: Upload API pytest log (on failure)
        if: failure() && steps.api_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-api-defect-log
          path: |
            .tmp/ci-api-pytest.txt
          if-no-files-found: warn

      - name: Web unit & integration tests
        run: pnpm test:web

      - name: Install Playwright browser
        run: pnpm --filter @cip/web exec playwright install chromium --with-deps

      # BACKLOG-099: live wipe/products e2e against disposable cip_e2e (not cip / not cip_test residue).
      - name: Seed cip_e2e + start API for live e2e
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://cip:cip@localhost:5432/cip_e2e
          DATABASE_URL_SYNC: postgresql://cip:cip@localhost:5432/cip_e2e
          DATABASE_URL_SYNC_MIGRATE: postgresql://cip:cip@localhost:5432/cip_e2e
          CIP_AUTH_MODE: stub
          CIP_DEV_CELERY_DISPATCH: in_process_thread
          # ALLOW_DB_WIPE intentionally unset — Settings must still load status (disabled).
        run: |
          set -euo pipefail
          python scripts/seed_e2e_minimal.py
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/cip-e2e-api.log 2>&1 &
          echo $! > /tmp/cip-e2e-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8001/health >/dev/null; then
              echo "API healthy on :8001"
              curl -sf http://127.0.0.1:8001/api/v1/dev/database-wipe
              echo
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy"
          cat /tmp/cip-e2e-api.log || true
          exit 1

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true
          CIP_E2E_LIVE_API: '1'
          CIP_E2E_API_URL: http://127.0.0.1:8001
          CIP_API_INTERNAL_URL: http://127.0.0.1:8001

      - name: Production build
        run: pnpm build
