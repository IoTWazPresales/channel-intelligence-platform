    scope: N-0013
    statement: 'PROPOSED 2026-09-02 (r3): primary navigation = capability domains derived from the data layer (Overview ·
      Stock & Sell-through · Supply & Inbound · Planning · Funding & Settlement · Commercial inputs · Data & Stewardship ·
      Administration[admin]); first destination = composed Overview with distinct Business dashboard (configurable, per-role
