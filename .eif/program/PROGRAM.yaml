      live/partial/substrate/planned; rail = live+partial (marked), directory = all four labelled. Δ5 export = canonical cpor_case
      model ↔ per-customer direction-aware template profile learned once via CanonicalColumnMappingPanel (supersedes CporHistoricalMappingProfile;
      retires RESELLER_HEADERS; round-trip diff = 0 is the certification). Δ6 cross-domain links: product panel → listings/competitors;
      case panel → LifecycleRail + activation. Δ7 proposed attention signals promo_not_activated / listing_price_change /
      competitor_mapping_pending shown as proposed, not live. Everything else in D-0007 unchanged; D-0002 remains deferred.
      Evidence: .eif/audit/NS_REDESIGN_R3_20260902/commercial/COMMERCIAL_DIRECTION.md, CAPABILITY_ACCOUNTING.md, CONSULT_SEED.md,
