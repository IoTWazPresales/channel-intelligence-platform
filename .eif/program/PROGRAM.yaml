      (phones on mobile data and unmanaged browsers can). N-0073 must surface the current address after each restart and avoid
      needless tunnel restarts. N-0074 is deferred.'
    origin: operator
    status: accepted
    supersedes: D-0048
  D-0055:
    id: D-0055
    scope: N-0075
    statement: 'Warren 2026-10-07 chose option (c): the invite email carries a single-use set-password link that expires in
      72 hours; no password is ever sent by mail. Roles stay the four existing roles.'
    origin: operator
    status: accepted
    supersedes: D-0049
  D-0056:
    id: D-0056
    scope: N-0065
    statement: 'Warren 2026-10-07, product-line access rule: every signed-in screen filters to the user''s assigned product
      lines; each assigned line is Read or Read-and-edit; a non-admin user with no assignment sees no product data; an ADMIN
      sees all product lines (admin bypasses the product-line filter). Differs from the dirty-tree build, where admin does
      not bypass an empty assignment; N-0065 changes that before closing.'
    origin: operator
    status: accepted
    supersedes: D-0022
  D-0057:
    id: D-0057
    scope: N-0071
    statement: 'Warren 2026-10-07, open-versus-shipped policy: accept as built. Shipment totals skip an open line when its
      strict shipped twin exists (shipment_strict_pair.py); fact rows are not rewritten and stay as imported (reversible).
      No cip data write.'
    origin: operator
    status: accepted
    supersedes: D-0024
  D-0058:
    id: D-0058
    scope: N-0073
    statement: 'N-0073 design accepted (N0073_DESIGN.md). Warren 2026-10-07: (1) Celery beat ON as part of always-on: the
      existing reaper, CST expected-report slots, FX fetch and (still switch-gated) listing poll run against cip; criterion
      6 ''no writes'' covers the supervisor and agent only, not the product''s own scheduled jobs. (2) No keep-awake: the
      PC sleeps normally; CIP is up while the machine is awake. Engineering calls (GOV-001): the always-on API runs without
      --reload and is restarted by the stop script after code changes; tasks waiting in Redis are listed to Warren before
      the first worker start; quick tunnel is restarted only when dead, /ready failing 10 min, or public /login failing 10
      min, and killed (not restarted) on positive evidence that auth is open.'
    origin: operator
    status: accepted
    supersedes: null
  D-0059:
    id: D-0059
    scope: N-0079
    statement: 'Warren 2026-10-07, budget ledger rules (N0079_PROPOSAL.md plus four improvements): budget is DERIVED (approving
      a lineup writes reserve rows; nobody types a pot; COMMERCIAL_DOMAIN_RULES 1.1). One append-only ledger at product x
      customer x landed-quarter grain; rolls up by product line x quarter and customer x quarter; limit check at product line
      x quarter. Committed = case approve event at ttl_support_usd with FX booked at approval; post-approval edits write adjust
      rows; cancel writes release. Consumed = case settle event at ttl_result_usd, releasing commitment minus result (rule
      1.6). Paid = separate rows from linked payment evidence, shown with link coverage. Transfers between lines/quarters
      are audited rows by admin or a planner with can_edit on that product line. Campaign and non-campaign reserve are stored
      as separate rows; an on-screen switch chooses which counts. The 211 settled historical cases are loaded as consumption
      rows tagged historical_import (proven on a clone before cip). Spend with no reserve shows as flagged ''unplanned spend'';
      lines with no landed quarter go to an ''unknown quarter'' bucket. Optional management caps per product line x quarter:
      admin-set, audited, over-cap flags and never blocks. Old fact_budget_* tables (0 rows) and hard-delete budget endpoints
      retire.'
    origin: operator
    status: accepted
    supersedes: D-0051
  D-0060:
    id: D-0060
    scope: N-0068
    statement: 'Warren 2026-10-05 (recorded in docs/BACKLOG.md BACKLOG-198 status line, entered in the ledger 2026-10-07):
      keep multiple catalogs; do not retire catalog_product. Per-line column maps overlay column_mapping_memory.mapping_profile.by_product_line
      (tenant_column_grain, one row per business per product line). Duplicate EAN stays FLAG, not a unique index. Sellable
      grain is every dim_product.product_line (N-0040, complete).'
    origin: operator
    status: accepted
    supersedes: D-0023
  D-0061:
    id: D-0061
    scope: N-0085
    statement: 'Warren 2026-10-07: listing coverage for all eight reporting customers (Game, Makro, Computer Mania, Incredible
      Connection, HiFi Corp, Evetech, Takealot, Amazon). CIP proposes each retailer product page found by EAN or model on
      the retailer''s own site for products that customer sells; a steward confirms; nothing auto-registers; one page reader
      per retailer; robots respected, per-retailer spacing, stop on 403/429. Listing capture polling is turned ON (about every
      30 minutes for watched listings) once N-0073 is verified: the supervisor''s worker environment sets CIP_LISTING_CAPTURE_SCHEDULE
      and CIP_LISTING_LIVE_FETCH. Daily search position per retailer site search uses terms Warren supplies.'
    origin: operator
    status: accepted
    supersedes: null
  D-0062:
    id: D-0062
    scope: N-0078
    statement: 'Warren 2026-10-07, listing quality (best version): (1) cross-retailer parity: the same product is compared
      across all retailers and the one behind is flagged; (2) floor: 6+ images, 150+ words description, key specs CPU/RAM/storage/screen/OS,
      title has brand + model; (3) specs that disagree with the product master are a core check; (4) every result shows snapshot
      age and stale is never a pass; (5) retailer-appropriate checks: buy box held by the retailer on marketplaces (Takealot,
      Amazon), listed/in stock/price on single-seller retailers; (6) quality shown beside that product''s weekly sell-through
      at the same retailer, labelled as correlation. Rating/review count shown, zero reviews flagged. Failures are amber flags
      and never block; missing data is grey ''No data'', never a failure. Search position per retailer site search as a second
      step with Warren''s terms. SEO is no longer a non-goal (spec section 8 v0 note superseded).'
    origin: operator
    status: accepted
    supersedes: D-0050
  D-0063:
    id: D-0063
    scope: N-0085
    statement: 'Warren 2026-10-07 on the N0085_DESIGN.md questions: (1) every reporting customer''s site is fetched, including
      Amazon product pages and Makro site search, regardless of their site terms or robots rules; Warren states the data is
      public product and price information and no privacy act applies; the site-terms risk is ASUS''s commercial call. (2)
      Discovery basis: only products each customer has reported selling in its sell-through files (last 6 months); Incredible
      Connection and HiFi Corp follow the same rule (4 products while their reports are stopped). (3) CIP fetches with an
      ordinary browser user agent, not a CIP-identifying one. Engineering bounds kept by GOV-001: polite per-site spacing,
      a per-site pause on 403/429, a per-run time limit; no CAPTCHA solving, proxy/IP rotation or other bot-protection evasion;
      a site that blocks shows as paused on screen.'
    origin: operator
    status: accepted
    supersedes: null
  D-0064:
    id: D-0064
    scope: N-0071
    statement: 'N-0071 follow-up to D-0057 (domain rule, Warren''s call; not built). Question: when an open line''s strict
      shipped twin has shipped less than the open quantity, should totals still skip the whole open line? Evidence (cip read-only,
      N0071_DISCOVERY.md): 552 strict pairs; 471 open = shipped, 71 open < shipped, 10 open > shipped (904 open units). In
      all 552 pairs a twin has the same order_line. Options: (a) keep as built (D-0057): skip the whole open line on key match;
      may under-count up to 904 units still open on those 10 lines; (b) count only the open quantity above the shipped twin
      total (open minus shipped, floor 0); needs a per-key sum and changes every reader on the shared helper at once; (c)
      keep (a) and list the 10 lines to Warren for a manual check. Assumptions: the Unship sheet row is a stale snapshot of
      the order line, not a separate remainder line. Impact: at most 904 units across 10 lines today; zero effect on the other
      542. Reversibility: high, read-side only, no fact rewrite in any option. Resolving step: Warren reviews the 10 lines
      against the OEM order report. Built today: (a), as accepted.'
    origin: gov-001
    status: superseded
    supersedes: null
  D-0065:
    id: D-0065
    scope: N-0071
    statement: 'Warren 2026-10-07, partial shipments: when an open line''s quantity exceeds its strict shipped twin''s shipped
      total (10 pairs, 904 open units on cip), totals count the remainder (open minus shipped) instead of skipping the whole
      open line. Lines where open <= shipped are still skipped. Stored fact rows are never rewritten (D-0057 unchanged).'
    origin: operator
    status: accepted
    supersedes: D-0064
  D-0066:
    id: D-0066
    scope: N-0065
    statement: 'Warren 2026-10-07 approves a product-line row-security migration (N0065_PERF.md fixes 1-3): (1) inline-able
      policy predicate with identical semantics (unset open, ''*'' all, listed lines only, ''no lines'' none, NULL product
      visible), (2) shipment_evidence_current made security_invoker so row security applies through it, (3) a distinct ''no
      lines'' sentinel so a leftover empty setting on a pooled connection reads as unset; plus the code-only net-requirement
      query fix. Proven on cip_test first with a parity test across all 45 protected tables, then applied to cip by the run
      using the configured migration (owner) connection; if no owner connection is configured, the run stops before cip and
      hands Warren the exact command.'
    origin: operator
    status: accepted
    supersedes: null
  D-0067:
    id: D-0067
    scope: N-0071
    statement: 'N-0071 follow-up to D-0065 (domain rule, Warren''s call; not picked). Question: what value (amount) should
      a partly shipped open line contribute to value totals, now that its quantity counts the remainder? Evidence (cip read-only,
      N0071_IMPL.md Round 2): 10 partial lines, open 904 units, shipped twins 568, remainder 336; all 10 have an amount; none
      is in any shipping KPI cohort today (current incoming, arriving week, overdue, landed), so value impact today is 0.
      Built now: (a). Options: (a) keep D-0057 for value: the open line adds no amount (built; units and value can disagree
      for these lines); (b) pro-rata: amount x remainder / open quantity; (c) full stored amount (double counts the shipped
      part''s value). Assumptions: the open row''s amount is the whole order line''s value. Impact: shipping KPI value-by-currency
      only (no other D-0065 reader totals amount). Reversibility: high, read-side only, no fact rewrite. Resolving step: Warren
      picks (a)/(b)/(c); (b) is one CASE in shipment_strict_pair.twin_remainder plus the KPI amount sum.'
    origin: gov-001
    status: proposed
    supersedes: null
  D-0068:
    id: D-0068
    scope: N-0071
    statement: 'Warren 2026-10-07, value of a partly shipped open line: pro-rata. Money totals count line amount x remainder
      / open quantity for an open line whose quantity exceeds its strict shipped twin''s shipped total. Fact rows are never
      rewritten. Applies to every shipment reader that totals open quantity or value, including channel ops, lineup net requirement,
      PO auto-link, PO reconciliation and the 1H rederivation hint (the five readers still on D-0057 after round 2).'
    origin: operator
    status: accepted
    supersedes: null
  D-0069:
    id: D-0069
    scope: N-0101
    statement: 'Warren 2026-10-08, after GOV-008 finding F1 (host asleep 18:18-08:54, no polling or scheduled jobs, public
      link down): no keep-awake; the laptop sleeps normally and CIP runs only while it is awake. Overnight gaps in listing
      history and scheduled jobs are accepted. The Market capability copy must say checks run every 30 minutes while the CIP
      host is running (N-0087). Reaffirms D-0058 (2).'
    origin: operator
    status: accepted
    supersedes: null
  D-0070:
    id: D-0070
    scope: N-0101
    statement: 'Warren 2026-10-08, listing snapshot storage (N-0101 finops FAIL: ~0.95 GB/day): store a raw page snapshot
      only when the extracted fields changed versus the listing''s previous observation, or the fetch/parse failed; raw snapshots
      older than 90 days are cleared (the snapshot payload only; observation rows and extracted fields are kept forever).
      Applies to all retailers and to N-0085 units.'
    origin: operator
    status: accepted
    supersedes: null
  D-0071:
    id: D-0071
    scope: N-0065
    statement: 'Warren 2026-10-08 (GOV-008 RUN-20261008-N0065-VER2 finding S3/F1): unresolved shipment evidence rows (NULL
      product id) INHERIT the product line of their identity''s resolved observation where one exists; truly unresolved rows
      (no resolved observation for the identity) are visible only to admins and stewards. The shipment_evidence_current view
      must choose each identity''s current row before row security applies, so a hidden newer row can never surface an older
      one. Also approved: ANALYZE on dim_product, fact_sales_sellout, fact_inventory_distributor, fact_demand_forecast and
      fact_inventory_reconciliation on cip (statistics only, no data change).'
    origin: operator
    status: accepted
    supersedes: null
  D-0072:
    id: D-0072
    scope: N-0065
    statement: 'Warren 2026-10-09: (1) keeps migration 20261009_0026 on cip (applied 02:31 by RUN-20261007-N0065-IMPL under
      GOV-001''s brief before his explicit approval of a second migration; retroactively approved). (2) Approves migration
      0027: the shipment-evidence current-row pick walks ix_shipment_ev_obs_identity_latest in order (measured ~77 ms vs ~450
      ms per scoped statement), proven on cip_test first, applied to cip with the owner connection, with downgrade. (3) Keeps
      fact_inbound_shipment under the lineage rule (544 truly unresolved inbound rows admin/steward only). (4) Rows with no
      product in commercial_lineup_line, cst_listing_seed, customer_listing and historical_lineup_import_line are visible
      to admins and stewards only (same as truly unresolved shipment rows); included in 0027.'
    origin: operator
    status: accepted
    supersedes: null
  D-0073:
    id: D-0073
    scope: N-0109
    statement: 'Warren 2026-10-09 on REPORTS_VISUAL_AUDIT.md: build reports, dashboards and KPI tiles to mockup-report-system
      (one chart system on the lab primitives, one KPI tile, one table style; ECharts retired); cover-type bars coloured by
      state (red < 2 weeks, amber < 4 weeks) with a threshold line; formula and scope text behind an ''About this figure''
      disclosure in plain words for everyone.'
    origin: operator
    status: accepted
    supersedes: null
  D-0074:
    id: D-0074
    scope: N-0086
    statement: 'Client-IP trust for the login throttle (N-0086): the web listens on 127.0.0.1 only (supervisor-enforced),
      so its peers are cloudflared or local processes. The Next proxy drops every visitor-supplied client-address header (X-Forwarded-For,
      X-Real-IP, Forwarded, CF-Connecting-IP(v6), True-Client-IP, X-Client-IP, X-Cluster-Client-IP) and sends exactly one
      address upstream in X-Forwarded-For and X-Real-IP: CF-Connecting-IP when it is a single valid IP literal (set and overwritten
      by the Cloudflare edge for tunnel traffic), otherwise 127.0.0.1. The API (127.0.0.1:8001) honours X-Forwarded-For only
      from a loopback peer (right-most entry; uvicorn''s default proxy-header trust of 127.0.0.1 gives the same answer) and
      keys the throttle on IPv4, IPv4-mapped IPv6 as IPv4, other IPv6 per /64. Rejected: trusting X-Forwarded-For from the
      tunnel (visitor-controlled); using the TCP peer (always loopback, would make one global bucket for all tunnel users).
      Residual: a local process can forge CF-Connecting-IP but can already reach the API directly; all non-tunnel local traffic
      shares one 127.0.0.1 bucket; if the web is ever bound wider than loopback, LAN clients also share that bucket (fails
      closed, not open). Reversible by code revert; no data change.'
    origin: agent
    status: proposed
    supersedes: null
  D-0075:
    id: D-0075
    scope: N-0086
    statement: 'Steward-write role matrix (N-0086): every write on /imports (DSI/CST/shipment pipeline steps, steward resolve/ignore/bulk/resolution-plan,
      batch propose/jobs), /cst-steward, /mappings, /product-master-gaps (scan, preview, apply) and /exceptions (delete, clear-all)
      requires steward or admin via require_roles. Job create/process/cancel/retry on /imports require admin, steward or planner
      at the route and then a per-template check: planners only for cpor_historical_cases and cpor_payment_evidence (create,
      process) plus current_lineup, unified_lineup, bulk_lineup_backfill (cancel, retry); viewers never. Reads stay sign-in
      only. Web: Import Center, steward queue, CST steward, catalogue gaps and shipment evidence pages show an honest read-only
      notice and disable write controls for planner/viewer; the exceptions inbox hides delete/clear for them. Not changed
      here (deferred): customer/distributor master writes and listing-capture writes remain sign-in only. product-master-gaps
      /preview is read-only server-side but is gated with the write it precedes.'
    origin: agent
    status: proposed
    supersedes: null
