      of names; empty Business dashboard holding prime position on Overview while attention text clips at 312px. Do not invent
      a Stores grid, pin-as-widget, SKU-assumptions editor, or SettlementContainer mount.'
    - Payments and Terms default to the existing wizard/editor (no ?import=1 / ?edit=1 gate). Claims does not grow a second
      importer; it routes to Import Center cpor_claim_evidence and the Case book.
    - 'Data: keep the four grouped LensTabs (D-0010 Option A). Rail-only destinations are listed in-page on Data chrome. Child
      pages crumb the named leaf.'
    - 'Sell-through workspace: operator filters and grid show customer/product names. API filter remains id after a name pick.
