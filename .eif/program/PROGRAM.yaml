      palette + capability directory as accelerators; leaves data-gated. Reports and Dashboards are siblings (saved report
      pins as widget). Mapping/resolution stays reachable per-job and as a cross-job Steward queue leaf (D-0002 still deferred).
      Evidence: .eif/audit/NS_REDESIGN_R3_20260902/DIRECTION.md, CONCEPTS.md, CONSULT_RESPONSE.md, rendered-verification.md,
      prototype apps/web/src/design-lab + app/(design-lab).'
