  D-0008:
    id: D-0008
    scope: N-0013
    statement: 'PROPOSED 2026-09-02 (r3.1): D-0007 as amended for the commercial capability. Δ1 Funding & Settlement → ''Promotions
      & Funding'' owning the whole cpor_case lifecycle (Promotion planner · Case book · Claims evidence · Payments · Plan
      templates · Terms & assumptions · Budget ledger). Δ2 ''Commercial inputs'' removed (its fixture tables promotion_plan/price_observations
      do not exist; promotion object is the same cpor_case row). Δ3 new evidence domain ''Market & Listings'' (Monitored listings
      · Price history · Promotion activation · Feed proposals · Competitor mappings[partial] · Competitor prices[substrate]
      · Competitor listings[planned] · Listing quality/SEO[planned]). Δ4 binary data-gating withdrawn → four-state leaf vocabulary
      live/partial/substrate/planned; rail = live+partial (marked), directory = all four labelled. Δ5 export = canonical cpor_case
      model ↔ per-customer direction-aware template profile learned once via CanonicalColumnMappingPanel (supersedes CporHistoricalMappingProfile;
      retires RESELLER_HEADERS; round-trip diff = 0 is the certification). Δ6 cross-domain links: product panel → listings/competitors;
      case panel → LifecycleRail + activation. Δ7 proposed attention signals promo_not_activated / listing_price_change /
      competitor_mapping_pending shown as proposed, not live. Everything else in D-0007 unchanged; D-0002 remains deferred.
      Evidence: .eif/audit/NS_REDESIGN_R3_20260902/commercial/COMMERCIAL_DIRECTION.md, CAPABILITY_ACCOUNTING.md, CONSULT_SEED.md,
      CONSULT_RESPONSE.md, rendered-verification.md (27 captures @1280/@390); prototype apps/web/src/design-lab (FundingSurface,
      PromotionPlannerSurface, PlanTemplatesSurface, MarketSurface, labNav LeafStatus).'
    origin: agent
    status: accepted
    supersedes: D-0007
  D-0009:
    id: D-0009
    scope: N-0010
    statement: 'RESOLVED 2026-09-04: the rejected N-0010 ''Actions / ranked commercial actions'' framing folds into Attention
      as a cross-domain surfacing and routing layer. N-0010 does not survive as its own work container. Binding terms: (1)
      Attention surfaces and routes; work completion happens in the owning domain, never from Overview; no approve/resolve/edit
      of any entity from Attention. (2) Items are DERIVED; they clear when the underlying condition clears (work done, or
      a justification recorded against the entity in its own domain); no dismiss and no snooze. (3) Assignment is a property
      of the entity, not the queue; Attention shows and filters by owner (mine / my domain / all) and does not reassign; filtering
      is the superuser mechanism; no separate notification system. (4) Signals group by shared entity using the existing entity
      graph, not inference; multiple symptoms of the same CPOR case, lineup or customer render as one situation; cross-entity
      clustering is future work. (5) Two signal classes: CONDITION (wrong now) and PROJECTION (will be wrong unless acted
      on by a computed date; value decays past that date). (6) Signal history is retained from the start; projections need
      learnt cycle times from our own history; items persist with lifecycle appeared/changed/resolved/expired and are not
      recomputed and discarded on each read. (7) The reasoning is the payload: every item shows the evidence chain, not only
      the conclusion. (8) Audit covers the system as well as people: record what the platform asserted, when, and from what
      evidence. Scope: domain modules are not redesigned; Attention composes from existing platform capability and must reuse
      existing projection inputs (transit history, cover, lineup planning, cycle times) rather than reimplement them; permitted
      domain touches are deep-link route targets with filters preserved, and a justification-recording affordance where a
      domain has none; a missing projection input is a separate slice — report and stop. The 2026-09-02 proposal to charter
      Promotions & Funding / Market & Listings / template-profile nodes as N-0010''s split, and to keep ranked commercial
      actions as a slimmed re-chartered planned node, is not accepted. Those surfaces remain D-0008 domain architecture. No
      nodes chartered by this recording. Evidence: .eif/audit/NS6_D0009_20260904/OPERATOR_DECISION.md.'
    origin: operator
    status: accepted
    supersedes: null
  D-0010:
    id: D-0010
    scope: N-0023
    statement: 'PROPOSED 2026-09-13: rail expansion vs in-page LensTabs. The two controls do not share one destination set
      (Data 13 rail leaves vs 4 grouped tabs; Funding/Market tabs include substrate/planned; Overview has no tabs; Planning/Admin
      rail hrefs point at hubs while tabs point at relocated workspaces). Recommended Option A: keep rail expansion; N-0023
      ports LabShell tokens only. Option B (domains-only rail) needs a later node after hubs/Overview/Data catalogs are unified.
      Option C (remove matching tabs) not recommended. Collapsed-active domain: no fill, no 3px bar, primary icon + weight
      600. Evidence: .eif/audit/NS11_RAIL_20260913/D0010_RAIL_VS_TABS.md. D-0002 untouched. Operator accepts A/B/C or rejects.'
    origin: agent
    status: accepted
    supersedes: null
