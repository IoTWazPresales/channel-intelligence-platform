# Facet → required quality dimensions. min_risk is inclusive (R2 means R2+).
# Nodes with no facets have no dimensions.

auth:
  security: {min_risk: R0}
  threat: {min_risk: R2}
  testing: {min_risk: R0}
  observability: {min_risk: R1}

ui:
  ux: {min_risk: R0}
  a11y: {min_risk: R0}
  rendered: {min_risk: R0}
  content: {min_risk: R1}

# Material UI/product design intelligence — attach explicitly; not implied by ui alone.
# Extra dimensions are process/evidence gates keyed by per-node artifact class
# (ia_concept < interaction < high_fidelity). Aesthetic quality is not scored here.
design_experience:
  design_artifact_class: {min_risk: R0}
  design_divergence: {min_risk: R0}
  design_signatures: {min_risk: R0}
  rendered_comparison: {min_risk: R0}
  design_sameness_review: {min_risk: R0}
  design_interaction_spec: {min_risk: R0}
  design_state_coverage: {min_risk: R0}
  design_identity_tokens: {min_risk: R0}
  design_execution_decisions: {min_risk: R0}

personal_data:
  privacy: {min_risk: R0}
  data_governance: {min_risk: R1}

schema:
  data_integrity: {min_risk: R0}
  backup_recovery: {min_risk: R2}
  migration_safety: {min_risk: R2}

data_migration:
  data_integrity: {min_risk: R0}
  backup_recovery: {min_risk: R1}
  migration_safety: {min_risk: R0}

payment:
