<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>EIF interact fixture</title></head>
<body>

  <p id="eif-status">idle</p>

      document.getElementById('eif-status').textContent = 'clicked';
    });

</body></html>
